name: aplikasi_nota
description: "Aplikasi nota / invoice offline berbasis Flutter & SQLite"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ✅ WAJIB untuk localization (No MaterialLocalizations fix)
  flutter_localizations:
    sdk: flutter

  # ===============================
  # DATABASE
  # ===============================
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # ===============================
  # STATE MANAGEMENT
  # ===============================
  provider: ^6.1.2

  # ===============================
  # FORMAT TANGGAL & ANGKA
  # ===============================
  intl: ^0.19.0

  # ===============================
  # PDF & PRINTING
  # ===============================
  pdf: ^3.11.0
  printing: ^5.13.0

  # ===============================
  # ICON
  # ===============================
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # ===============================
  # APP ICON
  # ===============================
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/wm.webp"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/wm.webp"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.webp
    - assets/images/wm.webp
    - assets/images/ttdbaru.webp
    - assets/images/norek.jpeg
